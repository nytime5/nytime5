{{ define "main" }}
<article class="post paper">
  <header class="post-header">
    <p class="post-meta">
      <span class="paper-kicker">Working Paper</span>
      <time class="post-date" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
    </p>
  </header>
  <div class="post-content">
    {{ .Content }}
  </div>
  <div class="post-share">
    <a class="share-btn share-btn--facebook" href="https://www.facebook.com/sharer/sharer.php?u={{ .Permalink }}" target="_blank" rel="noopener noreferrer">Share on Facebook</a>
    <a class="share-btn share-btn--x" href="https://x.com/intent/post?url={{ .Permalink }}&text={{ .Title | urlquery }}" target="_blank" rel="noopener noreferrer">Share on X</a>
  </div>
</article>
{{ end }}
